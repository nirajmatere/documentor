<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentor | Enterprise AI</title>
    <link rel="stylesheet" href="styles.css?v=12">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="app.js?v=12" defer></script>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px;">
            <h1 style="margin: 0;">Documentor</h1>
            <div style="display: flex; gap: 10px;">
                <button type="button" id="toggle-theme-btn" class="secondary-btn" style="height: fit-content;">
                    <span class="btn-text">🌓 Theme</span>
                </button>
                <button type="button" id="toggle-chat-btn" class="secondary-btn" style="height: fit-content;">
                    <span class="btn-text">💬 Chat with AI</span>
                </button>
            </div>
        </header>

        <div class="workspace-grid">
            <!-- Left: Sidebar -->
            <aside class="glass-panel" id="docs-sidebar">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">Documentation</h3>
                    <button type="button" id="toggle-sidebar-btn" style="background: none; border: none; cursor: pointer; color: var(--text-color); font-size: 1.2rem;" title="Toggle Sidebar">☰</button>
                </div>
                <ul id="docs-list" class="docs-list">
                    <li class="empty-state">No docs loaded. Enter a path and click Load.</li>
                </ul>
            </aside>
            
            <div id="sidebar-stub" class="hidden" style="display: flex; flex-direction: column; align-items: center; padding-top: 15px;">
                <button type="button" id="open-sidebar-btn" style="background: none; border: none; cursor: pointer; color: var(--text-color); font-size: 1.2rem;" title="Open Sidebar">☰</button>
            </div>

            <!-- Center: Viewer -->
            <section class="glass-panel" id="doc-viewer">
                <div id="viewer-content" class="markdown-body">
                    <h2>Welcome to Documentor</h2>
                    <p>Select a document from the left sidebar to read it here.</p>
                </div>
            </section>

            <!-- Right: Chat Window -->
            <aside class="glass-panel hidden" id="chat-section">
                <div class="chat-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">Chat with Codebase</h3>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button type="button" id="fullscreen-chat-btn" style="background: none; border: none; cursor: pointer; color: var(--text-color); font-size: 1.2rem;" title="Toggle Fullscreen">⛶</button>
                        <button type="button" id="close-chat-btn" style="background: none; border: none; cursor: pointer; color: var(--text-color); font-size: 1.2rem;" title="Close Chat">✕</button>
                    </div>
                </div>
                <div class="chat-container">
                    <div id="chat-history" class="chat-history">
                        <div class="chat-msg system">Ask me anything about this documentation</div>
                    </div>
                    <form id="chat-form" class="chat-input-area">
                        <textarea id="chat-input" rows="1" placeholder="How does the auth flow work?" required></textarea>
                        <button type="submit" class="primary-btn">Ask</button>
                    </form>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentor | Enterprise AI</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>Documentor</h1>
            <p>Enterprise-Grade AI Documentation Suite</p>
        </header>

        <section class="glass-panel" id="generate-section">
            <h2>Generate Documentation</h2>
            <form id="generate-form">
                <div class="input-group">
                    <label for="repo-path">Repository Path</label>
                    <input type="text" id="repo-path" placeholder="/home/user/projects/my-app" required>
                </div>
                <div class="input-group">
                    <label for="model-select">LLM Model</label>
                    <select id="model-select">
                        <option value="gpt-4o-mini">GPT-4o Mini (Default)</option>
                        <option value="gpt-4o">GPT-4o (Accurate)</option>
                        <option value="gemini/gemini-1.5-pro">Gemini 1.5 Pro (Large Context)</option>
                        <option value="claude-3-5-sonnet-20240620">Claude 3.5 Sonnet</option>
                    </select>
                </div>
                <button type="submit" id="generate-btn" class="primary-btn">
                    <span class="btn-text">Generate Docs</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
            <div id="generate-result" class="message hidden"></div>
        </section>

        <section class="glass-panel" id="chat-section">
            <h2>Chat with Codebase</h2>
            <div class="chat-container">
                <div id="chat-history" class="chat-history">
                    <div class="chat-msg system">Run generation above to index your codebase, then ask me anything about it!</div>
                </div>
                <form id="chat-form" class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="How does the authentication flow work?" required>
                    <button type="submit" class="primary-btn">Send</button>
                </form>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

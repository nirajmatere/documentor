<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentor | Enterprise AI</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>Documentor</h1>
        </header>

        <section class="glass-panel" id="controls-section">
            <form id="generate-form" class="controls-form">
                <div class="input-group">
                    <label for="repo-path">Repository Path</label>
                    <input type="text" id="repo-path" placeholder="/home/user/projects/my-app" required>
                </div>
                <div class="input-group">
                    <label for="model-select">LLM Model</label>
                    <input type="text" id="model-select" placeholder="e.g. gemini/gemini-3.6-flash" value="gemini/gemini-3.6-flash" required>
                </div>
                <div class="button-group">
                    <button type="submit" id="generate-btn" class="primary-btn">
                        <span class="btn-text">Generate Docs</span>
                        <span class="loader hidden"></span>
                    </button>
                    <button type="button" id="load-btn" class="secondary-btn">
                        <span class="btn-text">Load Existing</span>
                        <span class="loader hidden"></span>
                    </button>
                </div>
            </form>
            <div id="generate-result" class="message hidden"></div>
        </section>

        <div class="workspace-grid">
            <!-- Left: Sidebar -->
            <aside class="glass-panel" id="docs-sidebar">
                <h3>Documentation</h3>
                <ul id="docs-list" class="docs-list">
                    <li class="empty-state">No docs loaded. Enter a path and click Load.</li>
                </ul>
            </aside>

            <!-- Center: Viewer -->
            <section class="glass-panel" id="doc-viewer">
                <div id="viewer-content" class="markdown-body">
                    <h2>Welcome to Documentor</h2>
                    <p>Select a document from the left sidebar to read it here.</p>
                </div>
            </section>

            <!-- Right: Chat -->
            <section class="glass-panel" id="chat-section">
                <h3>Chat with Codebase</h3>
                <div class="chat-container">
                    <div id="chat-history" class="chat-history">
                        <div class="chat-msg system">Run generation or load an existing path, then ask me anything!</div>
                    </div>
                    <form id="chat-form" class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="How does the auth flow work?" required>
                        <button type="submit" class="primary-btn">Send</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>

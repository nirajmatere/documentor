name: Documentor AI Generation

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  document:
    runs-on: ubuntu-latest
    
    # We need contents: write to commit changes back to the PR
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so Documentor can analyze everything
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      
      - name: Run Documentor Action
        uses: ./ # Note: For external repos, this should be 'nirajmatere/documentor@main'
        # Optionally override the model (defaults to gemini/gemini-3.6-flash if not set):
        # with:
        #   model: 'gemini/gemini-1.5-pro'
        env:
          # Map your Repository Secret to the environment variable expected by your chosen model.
          # Default model is gemini/gemini-3.6-flash — just add GEMINI_API_KEY and you're done.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # To use OpenAI instead, set MODEL_NAME and add OPENAI_API_KEY:
          # MODEL_NAME: 'gpt-4o-mini'
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # To use Anthropic instead:
          # MODEL_NAME: 'claude-3-5-sonnet-20241022'
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      
      - name: Commit Generated Documentation
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add the generated artifacts
          git add documentor_docs/
          
          # Only commit if there are actually changes
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: Auto-update AI documentation [skip ci]"
          git push

name: Documentor AI Generation

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  document:
    runs-on: ubuntu-latest
    
    # We need contents: write to commit changes back to the PR
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so Documentor can analyze everything
          fetch-depth: 0
      
      - name: Run Documentor Action
        uses: ./ # Note: For external repos, this should be 'owner/documentor@main'
        # with:
        #   model: 'gpt-4o-mini'
        env:
          # Important: Map your Repository Secrets to the environment variables expected by your chosen model
          # The default model is gemini/gemini-3.6-flash. If you are using OpenAI, set MODEL_NAME explicitly:
          MODEL_NAME: 'gpt-4o-mini'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      
      - name: Commit Generated Documentation
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add the generated artifacts
          git add documentor_docs/
          
          # Only commit if there are actually changes
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: Auto-update AI documentation [skip ci]"
          git push

name: Documentor Pro
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Job ID from Documentor'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    
    # Required if they want the bot to push commits back to the repo
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history, highly recommended for codebase analysis tools
          fetch-depth: 0
          # head_ref is set for pull_request events; ref_name is set for workflow_dispatch
          ref: ${{ github.head_ref || github.ref_name }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Generate Docs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Starting Documentor generation..."
          pip install documentor-ai
          
          # This will automatically default to gemini/gemini-3.6-flash
          documentor generate .
          
          echo "Generation complete for job ${{ inputs.correlation_id }}"
          
      - name: Commit and Push Docs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add documentor_docs/
          
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: Auto-update AI documentation [skip ci]"
          git push

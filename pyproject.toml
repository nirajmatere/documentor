[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documentor-ai"
version = "0.1.12"
description = "Enterprise-grade AI documentation suite"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Documentor Team" }
]
dependencies = [
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "chromadb>=0.4.24",
    "litellm>=1.34.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "pathspec>=0.12.1",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
documentor = "documentor.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["documentor"]

name: 'Documentor AI - Auto Generate Code Documentation'
description: 'Automate your codebase documentation with AI. Uses LLMs to generate accurate, semantic, and highly readable markdown docs.'
inputs:
  model:
    description: 'LiteLLM compatible model to use'
    required: false
    default: ''
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.model }}

branding:
  icon: 'cpu'
  color: 'purple'
